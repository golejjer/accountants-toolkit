name: Check statutory pack

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check the fictional example pack
        run: python checker/validate.py examples/examplia

      - name: Check your pack
        run: |
          if grep -q '<jurisdiction>' pack/pack.yaml; then
            echo "pack/ has not been started yet (pack.yaml still holds the template placeholders), so it is not checked."
          else
            python checker/validate.py pack
          fi
